# HyperInkling with Docker Compose. Settings go in .env (scripts/wizard.py writes it; every
# variable of start.sh works there). One GPU serves one engine at a time.
#
#   scripts/setup-vllm.sh && scripts/build-image.sh   # once, ~1 hour: builds hyperinkling:sm75
#   python3 scripts/wizard.py      # or write .env by hand
#   docker compose up -d           # the first start downloads the checkpoint (~16 GB)
#   docker compose logs -f hyperinkling
#
# The port is published on 127.0.0.1 only. To serve other machines set BIND=0.0.0.0 and a
# VLLM_API_KEY in .env.
name: hyperinkling

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  prepare:
    image: ${IMAGE:-hyperinkling:sm75}
    # The checkpoint in ./models belongs to the host user (the wizard writes UID/GID).
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HF_HOME: /app/models/.hf-home
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        test -f /app/models/${CHECKPOINT:-Inkling-2-Mini-W4A16-g128-gptq}/config.json ||
        hf download ${HF_REPO:-Pentium95/Inkling-2-Mini-W4A16-g128-gptq}
        --local-dir /app/models/${CHECKPOINT:-Inkling-2-Mini-W4A16-g128-gptq}
    volumes:
      - ./models:/app/models

  hyperinkling:
    image: ${IMAGE:-hyperinkling:sm75}
    <<: *gpu
    depends_on:
      prepare:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      MODEL: /app/models/${CHECKPOINT:-Inkling-2-Mini-W4A16-g128-gptq}
      HOST: 0.0.0.0
      PORT: "8000"
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-8080}:8000"
    # The CPU prefix-cache tier (KV_OFFLOAD_GB) and the image processor cache live in
    # /dev/shm: room for both.
    shm_size: "${SHM_GB:-48}gb"
    ipc: private
    volumes:
      - ./models:/app/models
      - jit-cache:/cache
    restart: unless-stopped

volumes:
  jit-cache:
